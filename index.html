<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عباقرة القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e5a8e;
  --brown:#9b8b5c;
  --green:#5a8a6f;
  --light-bg:#e8dcc8;
  --dark-text:#1a1a1a;
  --white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Almarai',sans-serif;color:var(--dark-text);background:linear-gradient(135deg,#c9a876,#a89968);min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
#app{max-width:1100px;margin:0 auto;padding:16px}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--white);border-radius:16px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.12);border:none}
.logo-section{text-align:center;margin-bottom:20px}
h1{color:var(--primary);font-size:1.8rem;font-weight:800;margin-bottom:6px}
.logo-img{width:120px;height:120px;margin:0 auto 12px;display:block;max-width:100%}
h2{color:var(--primary);font-weight:800;margin-bottom:12px;font-size:1.4rem}
h3{color:var(--primary);font-weight:800}
.sub{color:#666;font-size:.95rem;text-align:center}
label{display:block;font-size:.9rem;color:var(--primary);margin:12px 0 6px;font-weight:800}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:2px solid var(--brown);background:#faf8f4;color:var(--dark-text);font-family:inherit;font-size:.95rem;transition:all 0.3s;font-weight:600}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,90,142,.1);background:var(--white)}
textarea{min-height:80px;resize:vertical}
button{cursor:pointer;font-family:inherit;font-weight:800;border:none;border-radius:10px;padding:12px 16px;font-size:.9rem;transition:all 0.3s}
.btn-primary{background:linear-gradient(135deg,var(--primary),#2a6db3);color:#fff;width:100%;margin-top:14px;padding:14px 16px;font-size:.95rem}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,90,142,.25)}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:rgba(30,90,142,.05)}
.btn-sm{padding:9px 14px;font-size:.85rem;margin-top:0}
.btn-danger{background:#c17a5f;color:#fff;font-weight:800}
.btn-danger:hover{background:#a86555}
.btn-wa{background:var(--green);color:#fff;font-weight:800}
.btn-wa:hover{background:#4a7a62}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row-item{flex:1;min-width:140px}
.topbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--primary),#2a6db3);border-radius:14px;padding:14px 16px;margin-bottom:14px;position:sticky;top:8px;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.topbar .logo{width:48px;height:48px;background:#fff;border-radius:8px;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar .logo img{width:100%;height:100%;object-fit:contain}
.topbar-text{color:#fff;flex:1}
.topbar-text .name{font-weight:800;font-size:1rem}
.topbar-text .school{font-size:.8rem;opacity:.95;font-weight:700}
.topbar-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);font-weight:800}
.topbar-btn:hover{background:rgba(255,255,255,.3)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
nav.tabs button{white-space:nowrap;background:#f0ebe0;color:#666;border:1px solid #ddd;font-weight:800;border-radius:10px;padding:9px 12px;font-size:.85rem}
nav.tabs button.active{background:var(--primary);color:#fff;border:none}
.item-row{display:flex;justify-content:space-between;align-items:center;background:#f5f1e8;border-radius:10px;padding:11px 13px;margin-bottom:10px;border:1px solid #ddd}
.icon-btn{min-width:36px;height:36px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0;border:none;cursor:pointer;font-weight:800;white-space:nowrap}
.icon-btn.edit{background:#e8d4c4;color:var(--brown)}
.icon-btn.del{background:#e8c4bc;color:#c17a5f}
.icon-btn.ok{background:#c8e0d0;color:var(--green)}
.actions-inline{display:flex;gap:6px}
.empty{color:#666;text-align:center;padding:30px 20px;font-size:.95rem}
.subject-block{background:#f5f1e8;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #ddd}
.rate-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rate-opts label{text-align:center;background:#fff;border-radius:10px;padding:14px 8px;cursor:pointer;font-size:.85rem;margin:0;border:2px solid #ddd;transition:all 0.3s;font-weight:800;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rate-opts label:hover{border-color:var(--primary);transform:scale(1.05)}
.rate-opts label.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.rate-opts input{display:none}
.report-view{background:linear-gradient(135deg,#c9a876,#a89968);color:var(--dark-text);border-radius:14px;padding:20px;margin-top:12px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.report-header{text-align:center;border-bottom:3px solid var(--primary);padding-bottom:12px;margin-bottom:12px}
.report-logo{width:80px;height:80px;margin:0 auto 10px;background:#fff;border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center}
.report-logo img{width:100%;height:100%;object-fit:contain}
.report-title{color:var(--primary);font-size:1.3rem;font-weight:900;margin:6px 0}
.report-school{color:#333;font-size:.9rem;font-weight:700}
.report-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.85rem;margin:12px 0;color:var(--dark-text)}
.report-meta-item{background:rgba(255,255,255,.8);padding:8px;border-radius:8px;font-weight:700;border-left:4px solid var(--primary)}
.report-meta-item b{color:var(--primary);display:block;font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:12px;background:#fff;border-radius:8px;overflow:hidden}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #ddd;font-weight:700}
th{background:var(--primary);color:#fff}
.footer-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.footer-actions button{flex:1;min-width:100px;font-size:.9rem}
.pill{display:inline-block;padding:6px 12px;border-radius:16px;font-size:.8rem;font-weight:800;white-space:nowrap;text-align:center}
.pill-success{background:#c8e0d0;color:var(--green)}
.pill-warning{background:#e8dcc8;color:var(--brown)}
.pill-danger{background:#e8c4bc;color:#c17a5f}
@media print{#app>*:not(.report-view){display:none!important}body{background:#fff}@page{margin:0}}
</style>
</head>

const K='qra_pro';
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function state(){window._st=window._st||load();return window._st}
function save(){localStorage.setItem(K,JSON.stringify(state()))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const MASTER_PWD='Oman-25';
const RATINGS=['ممتاز','جيد','يحتاج عناية'];
const HIJRI_MONTHS=['محرم','صفر','ربيع الأول','ربيع الثاني','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
let route='home';

function toHijri(dateStr){
  const d=new Date(dateStr);
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const jd=Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)+Math.floor((367*(m-2-12*(Math.floor((m-14)/12))))/12)-Math.floor((3*(Math.floor((y+4900+Math.floor((m-14)/12))/100)))/4)+day-32045;
  const l=jd+68569;
  const n=Math.floor((4*l)/146097);
  const l2=l-Math.floor((146097*n+3)/4);
  const i=Math.floor((4000*(l2+1))/1461001);
  const l3=l2-Math.floor((1461*i)/4)+31;
  const j=Math.floor((80*l3)/2447);
  const hy=l3-Math.floor((2447*j)/80);
  const l4=Math.floor(j/11);
  const hm=j+2-12*l4;
  const hz=100*(n-49)+i+l4;
  return{day:hy,month:hm,year:Math.round(hz),monthName:HIJRI_MONTHS[hm-1]};
}

function ensureDefaults(){
  const s=state();
  if(!s.subjects) s.subjects=['القرآن الكريم','اللغة العربية','الأعداد القرآنية','اللغة الإنجليزية','أخط بيدي','قطوف دانية','منظومة الأخلاق'];
  if(!s.reports) s.reports=[];
  if(!s.students) s.students=[];
  save();
}

function el(tag,attrs={},html=''){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k==='style')e.setAttribute('style',v);
    else e.setAttribute(k,v);
  });
  if(html)e.innerHTML=html;
  return e;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  const s=state();
  
  if(!s.teacher){app.appendChild(renderAuth());return;}
  
  // عرض التقرير إذا كان مختاراً
  if(route==='view'&&window._viewRep){
    app.appendChild(renderTopbar());
    app.appendChild(renderTabs());
    const report=renderReportView();
    if(report) app.appendChild(report);
    return;
  }
  
  ensureDefaults();
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());
  const view=el('div',{});
  
  if(route==='home') view.appendChild(renderHome());
  else if(route==='students') view.appendChild(renderStudents());
  else if(route==='subjects') view.appendChild(renderSubjects());
  else if(route==='newreport') view.appendChild(renderNewReport());
  else if(route==='archive') view.appendChild(renderArchive());
  else if(route==='settings') view.appendChild(renderSettings());
  
  app.appendChild(view);
}

function renderAuth(){
  const s=state();
  const wrap=el('div',{class:'center-screen'});
  const card=el('div',{class:'card'});
  card.style.maxWidth='400px';
  
  const logoSection=el('div',{class:'logo-section'});
  const img=el('img',{src:getLogoBase64(),class:'logo-img',style:'width:120px;height:120px'});
  logoSection.appendChild(img);
  logoSection.innerHTML+=`<h1>عباقرة القرآن</h1><div class="sub">نظام التقارير الأسبوعية</div>`;
  card.appendChild(logoSection);
  
  const mode=s._accounts&&s._accounts.length?'login':'register';
  const form=el('form',{});
  
  if(mode==='login'){
    form.innerHTML=`
      <label>اسم المستخدم</label><input name="u" required>
      <label>كلمة السر</label><input name="p" type="password" required>
      <button class="btn-primary" type="submit">دخول</button>
      <button type="button" class="btn-outline btn-sm" id="toReg" style="width:100%;margin-top:8px">حساب جديد</button>`;
  } else {
    form.innerHTML=`
      <label>اسم المستخدم</label><input name="u" required>
      <label>كلمة السر</label><input name="p" type="password" required>
      <label>اسم المعلم/المعلمة</label><input name="name" required>
      <label>المدرسة</label><input name="school" value="المدرسة القرآنية الوقفية">
      <label>الحلقة</label><input name="halaqa" required>
      <button class="btn-primary" type="submit">إنشاء حساب</button>`;
  }
  
  card.appendChild(form);
  wrap.appendChild(card);
  
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const accounts=s._accounts||[];
    
    if(mode==='login'){
      const acc=accounts.find(a=>a.username===fd.get('u')&&a.password===fd.get('p'));
      if(!acc){alert('بيانات غير صحيحة');return;}
      s.teacher={...acc};
      save();
      render();
    } else {
      if(accounts.some(a=>a.username===fd.get('u'))){alert('المستخدم موجود');return;}
      const acc={id:uid(),username:fd.get('u'),password:fd.get('p'),name:fd.get('name'),school:fd.get('school'),halaqa:fd.get('halaqa')};
      s._accounts=[acc];
      s.teacher={...acc};
      save();
      render();
    }
  });
  
  setTimeout(()=>{
    const regBtn=document.getElementById('toReg');
    if(regBtn) regBtn.addEventListener('click',()=>{s._accounts=[];save();render();});
  },0);
  
  return wrap;
}

function renderTopbar(){
  const s=state();
  const t=el('div',{class:'topbar'});
  const logo=el('div',{class:'logo'});
  const img=el('img',{src:getLogoBase64()});
  logo.appendChild(img);
  const text=el('div',{class:'topbar-text'});
  text.innerHTML=`<div class="name">${s.teacher.name}</div><div class="school">${s.teacher.school}</div>`;
  const btn=el('button',{class:'btn-outline btn-sm topbar-btn'});
  btn.textContent='خروج';
  btn.addEventListener('click',()=>{delete state().teacher;save();render();});
  t.append(logo,text,btn);
  return t;
}

function renderTabs(){
  const tabs=[['home','الرئيسية'],['students','الطلاب'],['subjects','المواد'],['newreport','تقرير'],['archive','الأرشيف'],['settings','إعدادات']];
  const n=el('nav',{class:'tabs'});
  tabs.forEach(([k,l])=>{
    const b=el('button',{class:route===k?'active':''},l);
    b.addEventListener('click',()=>{route=k;render()});
    n.appendChild(b);
  });
  return n;
}

function renderHome(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>نظرة عامة</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px"><div style="background:#f5f1e8;padding:14px;border-radius:10px;text-align:center"><div style="color:#666;font-size:.9rem">الطلاب</div><div style="font-size:1.8rem;font-weight:900;color:var(--primary)">${s.students.length}</div></div><div style="background:#f5f1e8;padding:14px;border-radius:10px;text-align:center"><div style="color:#666;font-size:.9rem">المواد</div><div style="font-size:1.8rem;font-weight:900;color:var(--primary)">${s.subjects.length}</div></div><div style="background:#f5f1e8;padding:14px;border-radius:10px;text-align:center"><div style="color:#666;font-size:.9rem">التقارير</div><div style="font-size:1.8rem;font-weight:900;color:var(--primary)">${s.reports.length}</div></div></div>`;
  return c;
}

function renderStudents(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>الطلاب</h2>`;
  const form=el('form',{class:'row'});
  form.innerHTML=`<input name="name" placeholder="اسم الطالب" required style="flex:2"><button class="btn-primary" style="flex:1;margin-top:0;padding:11px 10px" type="submit">+</button>`;
  form.addEventListener('submit',e=>{e.preventDefault();const n=new FormData(form).get('name').trim();if(!n)return;if(!s.students)s.students=[];s.students.push({id:uid(),name:n});form.reset();save();render();});
  c.appendChild(form);
  const list=el('div',{style:'margin-top:14px'});
  if(!s.students||!s.students.length) list.appendChild(el('div',{class:'empty'},'لا توجد طلاب'));
  else s.students.forEach(st=>{
    const row=el('div',{class:'item-row'});
    const nameSpan=el('span',{},st.name);
    const actions=el('div',{class:'actions-inline'});
    const editBtn=el('button',{class:'icon-btn edit',title:'تعديل'},'تعديل');
    const delBtn=el('button',{class:'icon-btn del',title:'حذف'},'حذف');
    editBtn.addEventListener('click',()=>{
      const inp=el('input',{value:st.name});
      inp.style.flex='1';
      row.innerHTML='';row.appendChild(inp);
      const ok=el('button',{class:'icon-btn ok',title:'حفظ'},'حفظ');
      ok.addEventListener('click',()=>{const v=inp.value.trim();if(v){st.name=v;save();}render();});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click();});
      row.appendChild(ok);
    });
    delBtn.addEventListener('click',()=>{if(confirm('حذف؟')){s.students=s.students.filter(x=>x.id!==st.id);save();render();}});
    actions.append(editBtn,delBtn);
    row.append(nameSpan,actions);
    list.appendChild(row);
  });
  c.appendChild(list);
  return c;
}

function renderSubjects(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>المواد</h2>`;
  const form=el('form',{class:'row'});
  form.innerHTML=`<input name="name" placeholder="اسم المادة" required style="flex:2"><button class="btn-primary" style="flex:1;margin-top:0;padding:11px 10px" type="submit">+</button>`;
  form.addEventListener('submit',e=>{e.preventDefault();const n=new FormData(form).get('name').trim();if(!n)return;s.subjects.push(n);form.reset();save();render();});
  c.appendChild(form);
  const list=el('div',{style:'margin-top:14px'});
  s.subjects.forEach((sub,i)=>{
    const row=el('div',{class:'item-row'});
    const nameSpan=el('span',{},sub);
    const actions=el('div',{class:'actions-inline'});
    const editBtn=el('button',{class:'icon-btn edit',title:'تعديل'},'تعديل');
    const delBtn=el('button',{class:'icon-btn del',title:'حذف'},'حذف');
    editBtn.addEventListener('click',()=>{
      const inp=el('input',{value:sub});
      inp.style.flex='1';
      row.innerHTML='';row.appendChild(inp);
      const ok=el('button',{class:'icon-btn ok',title:'حفظ'},'حفظ');
      ok.addEventListener('click',()=>{const v=inp.value.trim();if(v){s.subjects[i]=v;save();}render();});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click();});
      row.appendChild(ok);
    });
    delBtn.addEventListener('click',()=>{if(confirm('حذف؟')){s.subjects.splice(i,1);save();render();}});
    actions.append(editBtn,delBtn);
    row.append(nameSpan,actions);
    list.appendChild(row);
  });
  c.appendChild(list);
  return c;
}

function renderNewReport(){
  const s=state();
  const c=el('div',{class:'card'});
  if(!s.students||!s.students.length){c.innerHTML='<h2>تقرير</h2><div class="empty">أضف طلاب أولاً</div>';return c;}
  c.innerHTML=`<h2>تقرير جديد</h2>`;
  const top=el('div',{});
  top.innerHTML=`
    <label>الطالب</label>
    <select id="stu" required>${s.students.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
    <div class="row">
      <div class="row-item"><label>النوع</label><select id="rtype"><option value="الأسبوعي">الأسبوعي</option><option value="الشهري">الشهري</option></select></div>
    </div>
    <div class="row">
      <div class="row-item"><label>التاريخ</label><input id="rdate" type="date" required></div>
      <div class="row-item"><label>الهجري</label><input id="rdate-hijri" type="text" readonly></div>
    </div>
    <label>الفترة</label><input id="rperiod" placeholder="الأسبوع الأول">`;
  c.appendChild(top);
  
  setTimeout(()=>{
    const dateInput=document.getElementById('rdate');
    const hijriInput=document.getElementById('rdate-hijri');
    dateInput.valueAsDate=new Date();
    updateHijri();
    dateInput.addEventListener('change',updateHijri);
    function updateHijri(){
      const h=toHijri(dateInput.value);
      hijriInput.value=`${h.day} ${h.monthName} ${h.year}`;
    }
  },0);
  
  const subWrap=el('div',{style:'margin-top:14px'});
  s.subjects.forEach(sub=>{
    const safe=sub.replace(/\s+/g,'_');
    const b=el('div',{class:'subject-block'});
    b.innerHTML=`<h3>${sub}</h3><label>الإنجاز</label><textarea data-subj="${sub}" placeholder="..."></textarea><label>التقييم</label><div class="rate-opts" data-subj="${sub}">${RATINGS.map(r=>`<label><input type="radio" name="rate_${safe}" value="${r}">${r}</label>`).join('')}</div>`;
    subWrap.appendChild(b);
  });
  c.appendChild(subWrap);
  
  subWrap.querySelectorAll('.rate-opts').forEach(box=>{
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{
      box.querySelectorAll('label').forEach(l=>l.classList.remove('on'));
      inp.closest('label').classList.add('on');
    }));
  });
  
  const saveBtn=el('button',{class:'btn-primary'},'حفظ');
  saveBtn.addEventListener('click',()=>{
    const entries=s.subjects.map(sub=>{
      const safe=sub.replace(/\s+/g,'_');
      const text=subWrap.querySelector(`textarea[data-subj="${sub}"]`).value.trim();
      const rEl=subWrap.querySelector(`input[name="rate_${safe}"]:checked`);
      return{subject:sub,text,rating:rEl?rEl.value:''};
    });
    const rep={id:uid(),studentId:document.getElementById('stu').value,type:document.getElementById('rtype').value,period:document.getElementById('rperiod').value,date:document.getElementById('rdate').value,hijri:document.getElementById('rdate-hijri').value,entries};
    s.reports.unshift(rep);
    save();
    alert('تم الحفظ');
    route='archive';
    render();
  });
  c.appendChild(saveBtn);
  return c;
}

function renderArchive(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>الأرشيف</h2>`;
  if(!s.reports||!s.reports.length){c.appendChild(el('div',{class:'empty'},'لا توجد تقارير'));return c;}
  const grouped={};
  s.reports.forEach(r=>{
    const d=new Date(r.date).toLocaleDateString('ar-SA');
    if(!grouped[d]) grouped[d]=[];
    grouped[d].push(r);
  });
  Object.entries(grouped).sort((a,b)=>new Date(b[0])-new Date(a[0])).forEach(([date,reps])=>{
    const section=el('div',{style:'margin-bottom:14px'});
    section.innerHTML=`<h3 style="color:var(--primary);margin-bottom:10px">${date}</h3>`;
    reps.forEach(r=>{
      const stu=s.students.find(x=>x.id===r.studentId);
      const row=el('div',{class:'item-row'});
      const typeText=reportTypeLabel(r.type);
      row.innerHTML=`<span><b>${stu?stu.name:'-'}</b><br><span style="font-size:.8rem;color:#666">${typeText} • ${r.period}</span></span>`;
      const view=el('button',{class:'btn-outline btn-sm'});
      view.textContent='عرض';
      view.addEventListener('click',()=>{
        window._viewRep=r.id;
        route='view';
        render();
      });
      row.appendChild(view);
      section.appendChild(row);
    });
    c.appendChild(section);
  });
  return c;
}

function reportTypeLabel(type){
  if(!type) return '';
  if(type.includes('أسبوعي')) return 'الأسبوعي';
  if(type.includes('شهري')) return 'الشهري';
  return type;
}

function ratingPill(r){
  if(r==='ممتاز') return `<span class="pill pill-success">✓ ممتاز</span>`;
  if(r==='جيد') return `<span class="pill pill-warning">○ جيد</span>`;
  if(r==='يحتاج عناية') return `<span class="pill pill-danger">! يحتاج عناية</span>`;
  return '-';
}

function renderReportView(){
  const s=state();
  if(!window._viewRep) return el('div',{class:'card',html:'التقرير غير موجود'});
  const r=s.reports.find(x=>x.id===window._viewRep);
  if(!r) return el('div',{class:'card',html:'التقرير غير موجود'});
  const stu=s.students.find(x=>x.id===r.studentId);
  
  const c=el('div',{class:'card report-view'});
  
  const header=el('div',{class:'report-header'});
  const logo=el('div',{class:'report-logo'});
  const logoImg=el('img',{src:getLogoBase64()});
  logo.appendChild(logoImg);
  header.appendChild(logo);
  
  const title=el('div',{class:'report-title'});
  title.textContent=`التقرير ${reportTypeLabel(r.type)}`;
  header.appendChild(title);
  
  const school=el('div',{class:'report-school'});
  school.textContent=s.teacher.school;
  header.appendChild(school);
  
  c.appendChild(header);
  
  const meta=el('div',{class:'report-meta'});
  const item1=el('div',{class:'report-meta-item',html:`<b>الطالب</b> ${stu?stu.name:'-'}`});
  const item2=el('div',{class:'report-meta-item',html:`<b>الحلقة</b> ${s.teacher.halaqa}`});
  const item3=el('div',{class:'report-meta-item',html:`<b>التاريخ</b> ${new Date(r.date).toLocaleDateString('ar-SA')}`});
  const item4=el('div',{class:'report-meta-item',html:`<b>الهجري</b> ${r.hijri}`});
  const item5=el('div',{class:'report-meta-item',style:'grid-column:span 2',html:`<b>الفترة</b> ${r.period}`});
  meta.append(item1,item2,item3,item4,item5);
  c.appendChild(meta);
  
  const table=el('table',{});
  const thead=el('tr',{html:'<th>المادة</th><th>الإنجاز</th><th>التقييم</th>'});
  table.appendChild(thead);
  r.entries.forEach(e=>{
    const tr=el('tr',{});
    const td1=el('td',{html:`<b>${e.subject}</b>`});
    const td2=el('td',{});
    td2.textContent=e.text||'-';
    const td3=el('td',{html:ratingPill(e.rating)});
    tr.append(td1,td2,td3);
    table.appendChild(tr);
  });
  c.appendChild(table);
  
  const actions=el('div',{class:'footer-actions'});
  const back=el('button',{class:'btn-outline'});
  back.textContent='رجوع';
  back.addEventListener('click',()=>{route='archive';window._viewRep=null;render();});
  
  const printBtn=el('button',{class:'btn-primary'});
  printBtn.textContent='طباعة';
  printBtn.addEventListener('click',()=>window.print());
  
  const waBtn=el('button',{class:'btn-wa'});
  waBtn.textContent='واتساب';
  waBtn.addEventListener('click',()=>{
    let txt=`التقرير ${reportTypeLabel(r.type)}\n${s.teacher.school}\nالطالب: ${stu?stu.name:'-'}\nالحلقة: ${s.teacher.halaqa}\nالتاريخ: ${new Date(r.date).toLocaleDateString('ar-SA')}\nالهجري: ${r.hijri}\nالفترة: ${r.period}\n\n`;
    r.entries.forEach(e=>{txt+=`${e.subject}: ${e.text||'-'} | ${e.rating||'-'}\n`;});
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  });
  
  const del=el('button',{class:'btn-danger'});
  del.textContent='حذف';
  del.addEventListener('click',()=>{if(confirm('حذف؟')){s.reports=s.reports.filter(x=>x.id!==r.id);save();route='archive';window._viewRep=null;render();}});
  
  actions.append(back,printBtn,waBtn,del);
  c.appendChild(actions);
  return c;
}

function renderSettings(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>الإعدادات</h2>`;
  const form=el('form',{});
  form.innerHTML=`
    <label>الاسم</label><input name="name" value="${s.teacher.name}" required>
    <label>المدرسة</label><input name="school" value="${s.teacher.school}" required>
    <label>الحلقة</label><input name="halaqa" value="${s.teacher.halaqa}" required>
    <button class="btn-primary" type="submit">حفظ</button>`;
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    s.teacher.name=fd.get('name');
    s.teacher.school=fd.get('school');
    s.teacher.halaqa=fd.get('halaqa');
    const acc=(s._accounts||[]).find(a=>a.id===s.teacher.id);
    if(acc) Object.assign(acc,s.teacher);
    save();
    alert('تم الحفظ');
    render();
  });
  c.appendChild(form);
  return c;
}

render();
</script>
