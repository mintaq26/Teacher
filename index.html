<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير عباقرة القرآن</title>
<style>
:root{
  --primary:#1e5a8e; --primary-light:#3d7bb4;
  --brown:#c9a577; --brown-light:#e6d5c3; --brown-dark:#8b6f47;
  --blue-light:#b3d9f2; --blue-verylight:#d9ebf5;
  --card:#d9ebf5;
  --text:#1a1a1a; --text-light:#666;
  --font:'Segoe UI','Tahoma','Geeza Pro','Dubai','Noto Naskh Arabic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);color:var(--text);background:linear-gradient(135deg,var(--brown-light),#f5f0e8);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:1000px;margin:0 auto;padding:16px}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 8px 24px rgba(139,111,71,.18);border:2px solid var(--brown-light)}
.logo-section{text-align:center;margin-bottom:24px}
.logo-img{width:140px;height:140px;object-fit:contain;margin:0 auto 16px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.12))}
h1{color:var(--brown-dark);font-size:1.8rem;margin-bottom:6px;font-weight:900;letter-spacing:0.5px}
h2{color:var(--brown-dark);font-weight:900;margin-bottom:14px;font-size:1.4rem}
h3{color:var(--brown-dark);font-weight:900;font-size:1.1rem}
.sub{color:var(--text-light);font-size:.95rem;text-align:center;font-weight:600}
label{display:block;font-size:.9rem;color:var(--brown-dark);margin:14px 0 7px;font-weight:900}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--brown);background:var(--blue-verylight);color:var(--text);font-family:inherit;font-size:.95rem;transition:all 0.3s;font-weight:600}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brown-dark);box-shadow:0 0 0 4px rgba(139,111,71,.15);background:var(--blue-light)}
textarea{min-height:90px;resize:vertical}
button{cursor:pointer;font-family:inherit;font-weight:900;border:none;border-radius:12px;padding:13px 18px;font-size:.95rem;transition:all 0.3s;letter-spacing:0.3px}
.btn-primary{background:linear-gradient(135deg,var(--brown),var(--brown-light));color:#fff;width:100%;margin-top:18px;font-size:1rem;padding:15px 20px}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(139,111,71,.35)}
.btn-outline{background:transparent;border:2px solid var(--brown);color:var(--brown-dark)}
.btn-outline:hover{background:rgba(230,213,195,.2)}
.btn-sm{padding:10px 16px;font-size:.9rem;margin-top:0}
.btn-danger{background:#c17a5f;color:#fff}
.btn-danger:hover{background:#a86555;transform:translateY(-2px)}
.btn-wa{background:#5a9a7c;color:#fff}
.btn-wa:hover{background:#4a7a62;transform:translateY(-2px)}
.btn-img{background:var(--brown);color:#fff}
.btn-img:hover{background:var(--brown-dark);transform:translateY(-2px)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.row-item{flex:1;min-width:160px}
.topbar{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--brown-dark),var(--brown));border-radius:16px;padding:16px 18px;margin-bottom:18px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;box-shadow:0 6px 16px rgba(139,111,71,.35)}
.topbar .logo{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fff;padding:4px}
.topbar-text{color:#fff;flex:1}
.topbar-text .name{font-weight:900;font-size:1.05rem}
.topbar-text .school{font-size:.85rem;opacity:.95;font-weight:700}
.topbar-btn{background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:900}
.topbar-btn:hover{background:rgba(255,255,255,.35)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
nav.tabs button{white-space:nowrap;background:rgba(230,213,195,.5);color:var(--text-light);border:2px solid var(--brown-light);font-weight:800;border-radius:12px;padding:10px 14px}
nav.tabs button.active{background:linear-gradient(135deg,var(--brown),var(--brown-light));color:#fff;border:none;font-weight:900}
.item-row{display:flex;justify-content:space-between;align-items:center;background:var(--blue-verylight);border-radius:12px;padding:14px 16px;margin-bottom:12px;border:2px solid var(--blue-light)}
.icon-btn{width:40px;height:40px;padding:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;border:2px solid transparent;cursor:pointer;font-weight:900}
.icon-btn.edit{background:rgba(230,213,195,.4);color:var(--brown-dark);border-color:var(--brown-light)}
.icon-btn.del{background:rgba(193,122,95,.2);color:#a86555;border-color:#c17a5f}
.icon-btn.ok{background:rgba(90,154,124,.2);color:#2d7349;border-color:#5a9a7c}
.actions-inline{display:flex;gap:8px}
.empty{color:var(--text-light);text-align:center;padding:36px 20px;font-size:1rem;font-weight:700}
.subject-block{background:var(--blue-verylight);border-radius:14px;padding:18px;margin-bottom:16px;border:2px solid var(--blue-light)}
.rate-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.rate-opts label{text-align:center;background:#fff;border-radius:14px;padding:18px 10px;cursor:pointer;font-size:1rem;margin:0;border:2px solid var(--brown-light);transition:all 0.3s;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px;gap:6px}
.rate-opts label:hover{transform:scale(1.08);border-color:var(--brown);box-shadow:0 4px 12px rgba(139,111,71,.15)}
.rate-opts label.on{background:linear-gradient(135deg,var(--brown-light),var(--blue-light));color:var(--brown-dark);border-color:var(--brown-dark);box-shadow:0 6px 16px rgba(139,111,71,.25);transform:scale(1.05)}
.rate-opts input{display:none}
.rate-opts-emoji{font-size:2.2rem;line-height:1}
.rate-opts-text{font-size:.95rem;font-weight:900}
.pill{display:inline-block;padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:900}
.pill-success{background:rgba(90,154,124,.25);color:#2d7349}
.pill-warning{background:rgba(230,213,195,.5);color:var(--brown-dark)}
.pill-danger{background:rgba(193,122,95,.25);color:#a86555}
.report-view{background:var(--blue-light);color:var(--text);border-radius:16px;padding:24px;margin-top:16px;border:2px solid var(--brown);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.report-header{text-align:center;border-bottom:3px solid var(--brown);padding-bottom:16px;margin-bottom:18px}
.report-logo{width:100px;height:100px;object-fit:contain;margin:0 auto 12px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.1))}
.report-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.9rem;color:var(--text);margin:14px 0}
.report-meta-item{background:var(--blue-verylight);padding:10px;border-radius:10px;border:2px solid var(--brown-light);font-weight:700}
.report-meta-item b{color:var(--brown-dark);display:block;margin-bottom:3px;font-size:.95rem}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:14px}
th,td{padding:12px 10px;text-align:right;border-bottom:2px solid var(--brown-light);font-weight:700}
th{background:var(--blue-verylight);color:var(--brown-dark);border-bottom:3px solid var(--brown)}
.footer-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.footer-actions button{flex:1;min-width:110px;font-size:.95rem}
@media print{body{background:#fff}#app>*:not(.print-area){display:none !important}.print-area{display:block !important}@page{margin:0;size:A4 portrait}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='qra_v1_pro';
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function state(){window._st=window._st||load();return window._st}
function save(){localStorage.setItem(K,JSON.stringify(state()))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const MASTER_PWD='Oman-25';
const RATINGS=['ممتاز','جيد','يحتاج عناية'];
let route='home';

function toHijri(date){
  const d=new Date(date);
  const jd=Math.floor((d.getTime()/86400000))+2440588;
  const l=jd+68569;
  const n=Math.floor((4*l)/146097);
  const l2=l-Math.floor((146097*n+3)/4);
  const i=Math.floor((4000*(l2+1))/1461001);
  const l3=l2-Math.floor((1461*i)/4)+31;
  const j=Math.floor((80*l3)/2447);
  const d2=l3-Math.floor((2447*j)/80);
  const l4=Math.floor(j/11);
  const m=j+2-12*l4;
  const y=100*(n-49)+i+l4;
  return `${d2}/${m}/${Math.round(y)}`;
}

function ensureDefaults(){
  const s=state();
  if(!s.subjects) s.subjects=['القرآن الكريم','اللغة العربية','الأعداد القرآنية','اللغة الإنجليزية','أخط بيدي','قطوف دانية','منظومة الأخلاق'];
  if(!s.reports) s.reports=[];
  if(!s.students) s.students=[];
  save();
}

function el(tag,attrs={},html=''){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{if(k==='class')e.className=v;else e.setAttribute(k,v)});
  if(html)e.innerHTML=html;
  return e;
}

function getSchoolLogo(){
  return "data:image/svg+xml;utf8,<svg width='200' height='240' viewBox='0 0 200 240' xmlns='http://www.w3.org/2000/svg'><style>.qtext{font-family:Arial;font-weight:900;fill:%231e5a8e}.qsubtitle{font-family:Arial;font-size:8px;fill:%231e5a8e}.qarea{font-family:Arial;font-size:6px;fill:%231e5a8e}</style><rect x='30' y='20' width='140' height='130' rx='8' fill='none' stroke='%231e5a8e' stroke-width='4'/><line x1='100' y1='20' x2='100' y2='150' stroke='%231e5a8e' stroke-width='3'/><line x1='50' y1='50' x2='150' y2='50' stroke='%231e5a8e' stroke-width='2'/><path d='M70 70 Q70 90 85 100 Q100 95 100 80' fill='none' stroke='%231e5a8e' stroke-width='2'/><path d='M130 70 Q130 90 115 100 Q100 95 100 80' fill='none' stroke='%231e5a8e' stroke-width='2'/><text x='100' y='165' text-anchor='middle' class='qtext' font-size='14'>المدرسة القرآنية</text><text x='100' y='182' text-anchor='middle' class='qsubtitle'>الوقفية</text><text x='100' y='200' text-anchor='middle' class='qsubtitle'>Quranic Endowment School</text><text x='100' y='215' text-anchor='middle' class='qarea'>بولاية العاصمة</text></svg>";
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  const s=state();
  
  if(!s.teacher){app.appendChild(renderAuth());return;}
  ensureDefaults();
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());
  const view=el('div',{});
  
  if(route==='home') view.appendChild(renderHome());
  else if(route==='students') view.appendChild(renderStudents());
  else if(route==='subjects') view.appendChild(renderSubjects());
  else if(route==='newreport') view.appendChild(renderNewReport());
  else if(route==='archive') view.appendChild(renderArchive());
  else if(route==='view') view.appendChild(renderReportView());
  else if(route==='settings') view.appendChild(renderSettings());
  
  app.appendChild(view);
}

function renderAuth(){
  const s=state();
  const wrap=el('div',{class:'center-screen'});
  const card=el('div',{class:'card'});
  card.style.maxWidth='450px';
  
  const logoSection=el('div',{class:'logo-section'});
  const img=el('img',{src:getSchoolLogo(),class:'logo-img'});
  logoSection.appendChild(img);
  logoSection.innerHTML+=`<h1>عباقرة القرآن</h1><div class="sub">نظام التقارير الأسبوعية والشهرية</div>`;
  card.appendChild(logoSection);
  
  const mode=s._accounts&&s._accounts.length?'login':'register';
  const form=el('form',{});
  
  if(mode==='login'){
    form.innerHTML=`
      <label>اسم المستخدم</label><input name="u" required>
      <label>كلمة السر</label><input name="p" type="password" required>
      <button class="btn-primary" type="submit">🔓 دخول</button>
      <button type="button" class="btn-outline btn-sm" id="toReg" style="width:100%;margin-top:10px">➕ إنشاء حساب معلم جديد</button>
      <div style="text-align:center;font-size:.85rem;color:var(--text-light);margin-top:12px">
        <button type="button" id="forgotBtn" style="background:none;border:none;color:var(--brown-dark);text-decoration:underline;cursor:pointer;font-weight:900">هل نسيت كلمة السر؟</button>
      </div>`;
  } else {
    form.innerHTML=`
      <label>اسم المستخدم</label><input name="u" required>
      <label>كلمة السر</label><input name="p" type="password" required>
      <label>اسم المعلم/ة</label><input name="name" required>
      <label>اسم المدرسة</label><input name="school" value="المدرسة القرآنية الوقفية">
      <label>اسم الحلقة</label><input name="halaqa" required>
      <button class="btn-primary" type="submit">✅ إنشاء الحساب والدخول</button>`;
  }
  
  card.appendChild(form);
  wrap.appendChild(card);
  
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const accounts=s._accounts||[];
    
    if(mode==='login'){
      const acc=accounts.find(a=>a.username===fd.get('u')&&a.password===fd.get('p'));
      if(!acc){alert('❌ بيانات الدخول غير صحيحة');return;}
      s.teacher={...acc};
      save();
      render();
    } else {
      if(accounts.some(a=>a.username===fd.get('u'))){alert('⚠️ اسم مستخدم موجود بالفعل');return;}
      const acc={id:uid(),username:fd.get('u'),password:fd.get('p'),name:fd.get('name'),school:fd.get('school'),halaqa:fd.get('halaqa'),logo:''};
      s._accounts=[acc];
      s.teacher={...acc};
      save();
      render();
    }
  });
  
  setTimeout(()=>{
    const regBtn=document.getElementById('toReg');
    const forgotBtn=document.getElementById('forgotBtn');
    if(regBtn) regBtn.addEventListener('click',()=>{s._accounts=[];save();render();});
    if(forgotBtn) forgotBtn.addEventListener('click',()=>{
      const u=prompt('اكتب اسم المستخدم الخاص بك:');
      if(u){
        const acc=(s._accounts||[]).find(a=>a.username===u);
        if(!acc){alert('⚠️ اسم مستخدم غير موجود');return;}
        alert(`🔑 كلمة السر الخاصة بك: ${acc.password}\n\n💡 ملاحظة: كلمة السر الرئيسية: ${MASTER_PWD}`);
      }
    });
  },0);
  
  return wrap;
}

function renderTopbar(){
  const s=state();
  const t=el('div',{class:'topbar'});
  const img=el('img',{src:getSchoolLogo(),class:'logo'});
  const text=el('div',{class:'topbar-text'});
  text.innerHTML=`<div class="name">👨‍🏫 ${s.teacher.name}</div><div class="school">${s.teacher.school} • حلقة ${s.teacher.halaqa}</div>`;
  const btn=el('button',{class:'btn-outline btn-sm topbar-btn'},'🚪 خروج');
  btn.addEventListener('click',()=>{
    delete state().teacher;
    save();
    render();
  });
  t.append(img,text,btn);
  return t;
}

function renderTabs(){
  const tabs=[['home','📊 الرئيسية'],['students','👥 الطلاب'],['subjects','📚 المواد'],['newreport','📝 تقرير جديد'],['archive','📁 الأرشيف'],['settings','⚙️ الإعدادات']];
  const n=el('nav',{class:'tabs'});
  tabs.forEach(([k,l])=>{
    const b=el('button',{class:route===k?'active':''},l);
    b.addEventListener('click',()=>{route=k;render()});
    n.appendChild(b);
  });
  return n;
}

function renderHome(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>📊 نظرة عامة</h2>`;
  const stats=el('div',{class:'row',style:'margin-top:18px'});
  const stat1=el('div',{class:'row-item',style:'background:var(--blue-verylight);padding:18px;border-radius:12px;border:2px solid var(--blue-light)'});
  stat1.innerHTML=`<div style="font-size:.95rem;color:var(--text-light);font-weight:700">عدد الطلاب</div><div style="font-size:2.2rem;font-weight:900;color:var(--brown-dark)">${s.students.length}</div>`;
  const stat2=el('div',{class:'row-item',style:'background:var(--blue-verylight);padding:18px;border-radius:12px;border:2px solid var(--blue-light)'});
  stat2.innerHTML=`<div style="font-size:.95rem;color:var(--text-light);font-weight:700">عدد المواد</div><div style="font-size:2.2rem;font-weight:900;color:var(--brown-dark)">${s.subjects.length}</div>`;
  const stat3=el('div',{class:'row-item',style:'background:var(--blue-verylight);padding:18px;border-radius:12px;border:2px solid var(--blue-light)'});
  stat3.innerHTML=`<div style="font-size:.95rem;color:var(--text-light);font-weight:700">التقارير المحفوظة</div><div style="font-size:2.2rem;font-weight:900;color:var(--brown-dark)">${s.reports.length}</div>`;
  stats.append(stat1,stat2,stat3);
  c.appendChild(stats);
  return c;
}

function renderStudents(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>👥 الطلاب</h2><div class="sub" style="text-align:right;margin-bottom:14px">إدارة قائمة الطلاب المسجلين</div>`;
  const form=el('form',{class:'row'});
  form.innerHTML=`<input name="name" placeholder="أدخل اسم الطالب/ة" required style="flex:2"><button class="btn-primary" style="flex:1;margin-top:0;padding:12px 10px" type="submit">➕</button>`;
  form.addEventListener('submit',e=>{e.preventDefault();const n=new FormData(form).get('name').trim();if(!n)return;if(!s.students)s.students=[];s.students.push({id:uid(),name:n});form.reset();save();render();});
  c.appendChild(form);
  const list=el('div',{style:'margin-top:18px'});
  if(!s.students||!s.students.length) list.appendChild(el('div',{class:'empty'},'لم تضف طلاب بعد — ابدأ بإضافة أسماء طلابك'));
  else s.students.forEach(st=>{
    const row=el('div',{class:'item-row'});
    const nameSpan=el('span',{},st.name);
    const actions=el('div',{class:'actions-inline'});
    const editBtn=el('button',{class:'icon-btn edit',title:'تعديل'},'✏️');
    const delBtn=el('button',{class:'icon-btn del',title:'حذف'},'🗑️');
    editBtn.addEventListener('click',()=>{
      const inp=el('input',{value:st.name});
      inp.style.flex='1';
      row.innerHTML='';row.appendChild(inp);
      const ok=el('button',{class:'icon-btn ok',title:'حفظ'},'✔️');
      ok.addEventListener('click',()=>{const v=inp.value.trim();if(v){st.name=v;save();}render();});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click();});
      row.appendChild(ok);
    });
    delBtn.addEventListener('click',()=>{if(confirm('🗑️ حذف هذا الطالب؟')){s.students=s.students.filter(x=>x.id!==st.id);save();render();}});
    actions.append(editBtn,delBtn);
    row.append(nameSpan,actions);
    list.appendChild(row);
  });
  c.appendChild(list);
  return c;
}

function renderSubjects(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>📚 المواد الدراسية</h2><div class="sub" style="text-align:right;margin-bottom:14px">معايير التقييم التي ستظهر في كل تقرير</div>`;
  const form=el('form',{class:'row'});
  form.innerHTML=`<input name="name" placeholder="أدخل اسم المادة" required style="flex:2"><button class="btn-primary" style="flex:1;margin-top:0;padding:12px 10px" type="submit">➕</button>`;
  form.addEventListener('submit',e=>{e.preventDefault();const n=new FormData(form).get('name').trim();if(!n)return;s.subjects.push(n);form.reset();save();render();});
  c.appendChild(form);
  const list=el('div',{style:'margin-top:18px'});
  s.subjects.forEach((sub,i)=>{
    const row=el('div',{class:'item-row'});
    const nameSpan=el('span',{},sub);
    const actions=el('div',{class:'actions-inline'});
    const editBtn=el('button',{class:'icon-btn edit',title:'تعديل'},'✏️');
    const delBtn=el('button',{class:'icon-btn del',title:'حذف'},'🗑️');
    editBtn.addEventListener('click',()=>{
      const inp=el('input',{value:sub});
      inp.style.flex='1';
      row.innerHTML='';row.appendChild(inp);
      const ok=el('button',{class:'icon-btn ok',title:'حفظ'},'✔️');
      ok.addEventListener('click',()=>{const v=inp.value.trim();if(v){s.subjects[i]=v;save();}render();});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click();});
      row.appendChild(ok);
    });
    delBtn.addEventListener('click',()=>{if(confirm('🗑️ حذف هذه المادة؟')){s.subjects.splice(i,1);save();render();}});
    actions.append(editBtn,delBtn);
    row.append(nameSpan,actions);
    list.appendChild(row);
  });
  c.appendChild(list);
  return c;
}

function renderNewReport(){
  const s=state();
  const c=el('div',{class:'card'});
  if(!s.students||!s.students.length){c.innerHTML='<h2>📝 تقرير جديد</h2><div class="empty">أضف طلاب أولاً من تبويب "الطلاب"</div>';return c;}
  c.innerHTML=`<h2>📝 تقرير جديد</h2>`;
  const top=el('div',{});
  top.innerHTML=`
    <label>⭐ اختر الطالب/ة</label>
    <select id="stu" required>${s.students.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
    <div class="row">
      <div class="row-item"><label>📊 نوع التقرير</label><select id="rtype"><option value="أسبوعي">أسبوعي 📅</option><option value="شهري">شهري 📆</option></select></div>
    </div>
    <div class="row">
      <div class="row-item"><label>📌 التاريخ الميلادي</label><input id="rdate" type="date" required></div>
      <div class="row-item"><label>🕌 التاريخ الهجري</label><input id="rdate-hijri" type="text" readonly placeholder="سيحسب تلقائياً"></div>
    </div>
    <div class="row"><div class="row-item"><label>📝 اسم الفترة / الأسبوع</label><input id="rperiod" placeholder="مثال: الأسبوع الثالث من أكتوبر 2025"></div></div>`;
  c.appendChild(top);
  
  setTimeout(()=>{
    const dateInput=document.getElementById('rdate');
    const hijriInput=document.getElementById('rdate-hijri');
    dateInput.valueAsDate=new Date();
    hijriInput.value=toHijri(dateInput.value);
    dateInput.addEventListener('change',()=>{
      hijriInput.value=toHijri(dateInput.value);
    });
  },0);
  
  const subWrap=el('div',{style:'margin-top:18px'});
  s.subjects.forEach(sub=>{
    const safe=sub.replace(/\s+/g,'_');
    const b=el('div',{class:'subject-block'});
    b.innerHTML=`<h3>${sub}</h3>
      <label>✍️ ما تم إنجازه</label>
      <textarea data-subj="${sub}" data-field="text" placeholder="أكتب ملخص ما تم إنجازه..."></textarea>
      <label style="margin-top:12px">⭐ التقييم</label>
      <div class="rate-opts" data-subj="${sub}">
        <label class="sel-${RATINGS[0].replace(' ','_')}"><input type="radio" name="rate_${safe}" value="${RATINGS[0]}"><div class="rate-opts-emoji">🌟</div><div class="rate-opts-text">${RATINGS[0]}</div></label>
        <label class="sel-${RATINGS[1].replace(' ','_')}"><input type="radio" name="rate_${safe}" value="${RATINGS[1]}"><div class="rate-opts-emoji">⭕</div><div class="rate-opts-text">${RATINGS[1]}</div></label>
        <label class="sel-${RATINGS[2].replace(' ','_')}"><input type="radio" name="rate_${safe}" value="${RATINGS[2]}"><div class="rate-opts-emoji">⚠️</div><div class="rate-opts-text">${RATINGS[2]}</div></label>
      </div>`;
    subWrap.appendChild(b);
  });
  c.appendChild(subWrap);
  
  subWrap.querySelectorAll('.rate-opts').forEach(box=>{
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{
      box.querySelectorAll('label').forEach(l=>l.classList.remove('on'));
      inp.closest('label').classList.add('on');
    }));
  });
  
  const saveBtn=el('button',{class:'btn-primary'},'💾 حفظ التقرير');
  saveBtn.addEventListener('click',()=>{
    const stuId=document.getElementById('stu').value;
    const type=document.getElementById('rtype').value;
    const period=document.getElementById('rperiod').value||'-';
    const date=document.getElementById('rdate').value||new Date().toISOString().split('T')[0];
    const hijri=document.getElementById('rdate-hijri').value||toHijri(date);
    const entries=s.subjects.map(sub=>{
      const safe=sub.replace(/\s+/g,'_');
      const text=subWrap.querySelector(`textarea[data-subj="${sub}"]`).value.trim();
      const rEl=subWrap.querySelector(`input[name="rate_${safe}"]:checked`);
      return{subject:sub,text,rating:rEl?rEl.value:''};
    });
    const rep={id:uid(),studentId:stuId,type,period,date,hijri,entries,images:[]};
    s.reports.unshift(rep);
    save();
    alert('✅ تم حفظ التقرير بنجاح!');
    route='archive';
    render();
  });
  c.appendChild(saveBtn);
  return c;
}

function renderArchive(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>📁 الأرشيف</h2>`;
  if(!s.reports||!s.reports.length){c.appendChild(el('div',{class:'empty'},'لا توجد تقارير محفوظة بعد — ابدأ بإنشاء تقريرك الأول'));return c;}
  const grouped={};
  s.reports.forEach(r=>{
    const d=new Date(r.date).toLocaleDateString('ar-SA');
    if(!grouped[d]) grouped[d]=[];
    grouped[d].push(r);
  });
  Object.entries(grouped).sort((a,b)=>new Date(b[0])-new Date(a[0])).forEach(([date,reps])=>{
    const section=el('div',{style:'margin-bottom:18px'});
    section.innerHTML=`<h3 style="color:var(--brown-dark);margin-bottom:12px">📅 ${date}</h3>`;
    reps.forEach(r=>{
      const stu=s.students.find(x=>x.id===r.studentId);
      const row=el('div',{class:'item-row'});
      row.innerHTML=`<span><b style="font-size:1.05rem">${stu?stu.name:'—'}</b><br><span style="font-size:.85rem;color:var(--text-light);font-weight:700">${r.type} • ${r.period}</span></span>`;
      const view=el('button',{class:'btn-outline btn-sm'},'👁️ عرض');
      view.addEventListener('click',()=>{route='view';window._viewRep=r.id;render();});
      row.appendChild(view);
      section.appendChild(row);
    });
    c.appendChild(section);
  });
  return c;
}

function ratingPill(r){
  if(r==='ممتاز') return `<span class="pill pill-success">🌟 ممتاز</span>`;
  if(r==='جيد') return `<span class="pill pill-warning">⭕ جيد</span>`;
  if(r==='يحتاج عناية') return `<span class="pill pill-danger">⚠️ يحتاج عناية</span>`;
  return '—';
}

function renderReportView(){
  const s=state();
  const r=s.reports.find(x=>x.id===window._viewRep);
  if(!r) return el('div',{class:'empty'},'التقرير غير موجود');
  const stu=s.students.find(x=>x.id===r.studentId);
  const c=el('div',{class:'card'});
  
  const rv=el('div',{class:'report-view'});
  const img=el('img',{src:getSchoolLogo(),class:'report-logo'});
  rv.appendChild(img);
  const header=el('div',{class:'report-header'});
  header.innerHTML=`<h2 style="margin:0;color:var(--brown-dark)">📊 التقرير ${r.type}</h2><div style="color:var(--text-light);font-size:.95rem;font-weight:700;margin-top:6px">المدرسة القرآنية الوقفية</div>`;
  rv.appendChild(header);
  
  const meta=el('div',{class:'report-meta'});
  meta.innerHTML=`
    <div class="report-meta-item"><b>👤 الطالب/ة:</b> ${stu?stu.name:'—'}</div>
    <div class="report-meta-item"><b>📍 الحلقة:</b> ${s.teacher.halaqa}</div>
    <div class="report-meta-item"><b>📅 التاريخ:</b> ${new Date(r.date).toLocaleDateString('ar-SA')}</div>
    <div class="report-meta-item"><b>🕌 التاريخ الهجري:</b> ${r.hijri||toHijri(r.date)}</div>
    <div class="report-meta-item" style="grid-column:span 2"><b>📝 الفترة:</b> ${r.period}</div>`;
  rv.appendChild(meta);
  
  const table=el('table',{});
  table.innerHTML=`<tr><th>المادة</th><th>ما تم إنجازه</th><th>التقييم</th></tr>`;
  r.entries.forEach(e=>{
    const tr=el('tr',{});
    tr.innerHTML=`<td style="width:25%;font-weight:900">${e.subject}</td><td>${e.text||'—'}</td><td style="width:20%;text-align:center">${ratingPill(e.rating)}</td>`;
    table.appendChild(tr);
  });
  rv.appendChild(table);
  c.appendChild(rv);
  
  const actions=el('div',{class:'footer-actions'});
  const back=el('button',{class:'btn-outline'},'◀️ رجوع');
  back.addEventListener('click',()=>{route='archive';render();});
  
  const printBtn=el('button',{class:'btn-primary'},'🖨️ طباعة');
  printBtn.addEventListener('click',()=>window.print());
  
  const waBtn=el('button',{class:'btn-wa'},'💬 واتساب');
  waBtn.addEventListener('click',()=>{
    let txt=`*📊 التقرير ${r.type}*\n🏫 المدرسة القرآنية الوقفية\n👤 الطالب: ${stu?stu.name:'—'}\n📍 الحلقة: ${s.teacher.halaqa}\n📅 التاريخ: ${new Date(r.date).toLocaleDateString('ar-SA')}\n🕌 الهجري: ${r.hijri||toHijri(r.date)}\n📝 الفترة: ${r.period}\n\n`;
    r.entries.forEach(e=>{txt+=`*${e.subject}*\n${e.text||'—'} | ${e.rating||'—'}\n\n`;});
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  });
  
  const del=el('button',{class:'btn-danger'},'🗑️ حذف');
  del.addEventListener('click',()=>{if(confirm('🗑️ حذف هذا التقرير بشكل نهائي؟')){s.reports=s.reports.filter(x=>x.id!==r.id);save();route='archive';render();}});
  
  actions.append(back,printBtn,waBtn,del);
  c.appendChild(actions);
  
  return c;
}

function renderSettings(){
  const s=state();
  const c=el('div',{class:'card'});
  c.innerHTML=`<h2>⚙️ إعدادات المعلم</h2>`;
  const form=el('form',{});
  form.innerHTML=`
    <label>👨‍🏫 اسم المعلم/ة</label><input name="name" value="${s.teacher.name}" required>
    <label>🏫 اسم المدرسة</label><input name="school" value="${s.teacher.school}" required>
    <label>📍 اسم الحلقة</label><input name="halaqa" value="${s.teacher.halaqa}" required>
    <button class="btn-primary" type="submit">💾 حفظ التعديلات</button>`;
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const newTeacher={...s.teacher,name:fd.get('name'),school:fd.get('school'),halaqa:fd.get('halaqa')};
    const acc=(s._accounts||[]).find(a=>a.id===s.teacher.id);
    if(acc) Object.assign(acc,newTeacher);
    s.teacher=newTeacher;
    save();
    alert('✅ تم الحفظ بنجاح!');
    render();
  });
  c.appendChild(form);
  return c;
}

render();
</script>
</body>
</html>
